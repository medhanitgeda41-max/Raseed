[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 50
port = 8501

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#008080"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7F6"
textColor = "#1E293B"
font = "sans serif"

[client]
toolbarMode = "minimal"
